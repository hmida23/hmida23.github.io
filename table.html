<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الجدول الدراسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#C9A356;
    --c-effl:#5AA9E6;
    --c-effl-bg: rgba(90,169,230,0.14);
    --c-infs:#3FBF9F;
    --c-infs-bg: rgba(63,191,159,0.14);
    --c-math:#E8834A;
    --c-math-bg: rgba(232,131,74,0.16);
    --c-comm:#B08BF0;
    --c-comm-bg: rgba(176,139,240,0.16);
  }

  /* ---- Dark theme (default) ---- */
  html[data-theme="dark"]{
    --ink:#0F1626;
    --panel:#171F35;
    --panel-2:#1E2A47;
    --paper:#F3EFE6;
    --line: rgba(243,239,230,0.10);
    --muted:#9AA3BD;
    --gold-soft: rgba(201,163,86,0.16);
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
  }

  /* ---- Light theme ---- */
  html[data-theme="light"]{
    --ink:#FBF9F4;
    --panel:#FFFFFF;
    --panel-2:#F3EFE4;
    --paper:#221B10;
    --line: rgba(34,27,16,0.10);
    --muted:#79705F;
    --gold-soft: rgba(201,163,86,0.20);
    --shadow: 0 10px 24px rgba(90,70,30,0.10);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(201,163,86,0.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(90,169,230,0.08), transparent 60%),
      var(--ink);
    color: var(--paper);
    font-family: 'Cairo', sans-serif;
    min-height:100vh;
    padding: 30px 16px 60px;
    transition: background .25s ease, color .25s ease;
  }

  .wrap{ max-width: 1180px; margin: 0 auto; }

  /* ===== Theme toggle ===== */
  .theme-toggle{
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 50;
    display:flex; align-items:center; gap:8px;
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 8px;
    box-shadow: var(--shadow);
    cursor:pointer;
    user-select:none;
  }
  .theme-toggle .icon{
    width:30px; height:30px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    background: var(--gold-soft);
  }
  .theme-toggle .label{
    font-size:12.5px; font-weight:700; color:var(--muted);
    padding-inline-end:4px;
  }

  /* ===== Header ===== */
  header{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:flex-end;
    gap:20px;
    padding: 44px 0 26px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 30px;
  }
  .eyebrow{
    font-size:13px;
    letter-spacing:1px;
    color: var(--gold);
    font-weight:700;
    margin-bottom:10px;
  }
  h1{
    font-family:'Amiri', serif;
    font-size: clamp(28px, 5vw, 44px);
    margin:0 0 6px;
    line-height:1.25;
  }
  .sub{ color:var(--muted); font-size:14px; }

  .stats{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }
  .stat{
    background: var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 16px;
    min-width:96px;
    text-align:center;
    box-shadow: var(--shadow);
  }
  .stat .n{ font-size:22px; font-weight:800; color:var(--gold); font-family:'Amiri',serif; }
  .stat .l{ font-size:11.5px; color:var(--muted); margin-top:2px; }

  /* ===== Legend ===== */
  .legend{
    display:flex; gap:10px; flex-wrap:wrap;
    margin-bottom:22px;
  }
  .tag{
    display:flex; align-items:center; gap:8px;
    padding:7px 14px; border-radius:999px;
    background:var(--panel); border:1px solid var(--line);
    font-size:12.5px; font-weight:600; color:var(--paper);
  }
  .dot{ width:9px;height:9px;border-radius:50%; flex-shrink:0; }

  /* ===== Timetable (desktop/tablet) ===== */
  .board-scroll{ overflow-x:auto; padding-bottom:6px; }
  .board{
    min-width: 860px;
    display:grid;
    grid-template-columns: 66px repeat(7, 1fr);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    background: var(--panel);
    box-shadow: var(--shadow);
  }

  .head-cell{
    background: var(--panel-2);
    padding:12px 6px;
    text-align:center;
    border-bottom:1px solid var(--line);
    border-inline-start:1px solid var(--line);
  }
  .head-cell:first-child{ border-inline-start:none; }
  .head-cell .day{ font-weight:800; font-size:13.5px; }
  .head-cell .date{ font-size:11px; color:var(--muted); margin-top:2px; }
  .head-cell.off .day{ color:var(--muted); }
  .head-cell.time-head{ background:var(--panel); }

  .time-col{
    display:grid;
    grid-template-rows: repeat(28, 20px);
  }
  .time-col .tick{
    font-size:10px;
    color:var(--muted);
    text-align:center;
    border-top:1px solid var(--line);
    padding-top:2px;
  }
  .time-col .tick:first-child{ border-top:none; }

  .day-col{
    position:relative;
    display:grid;
    grid-template-rows: repeat(28, 20px);
    border-inline-start:1px solid var(--line);
    background-image: repeating-linear-gradient(
      to bottom, transparent 0, transparent 39px, var(--line) 39px, var(--line) 40px
    );
  }
  .day-col.off{
    background: repeating-linear-gradient(135deg, var(--line) 0 10px, transparent 10px 20px);
  }

  .event{
    position:relative;
    margin:2px 3px;
    border-radius:10px;
    padding:7px 8px;
    font-size:10.8px;
    line-height:1.3;
    overflow:hidden;
    border-inline-start: 3px solid var(--c);
    background: var(--bg);
  }
  .event .code{ font-weight:800; font-size:11.8px; display:block; }
  .event .kind{ color:var(--muted); font-size:10px; display:block; margin:1px 0; }
  .event .room{ font-size:10px; color:var(--paper); opacity:.85; }

  /* ===== Detail cards ===== */
  h2.section-title{
    font-family:'Amiri',serif;
    font-size:22px;
    margin:40px 0 16px;
    display:flex; align-items:center; gap:12px;
  }
  h2.section-title::after{
    content:"";
    flex:1;
    height:1px;
    background:var(--line);
  }

  .day-block{ margin-bottom: 20px; }
  .day-block > .dname{
    font-weight:800;
    font-size:14.5px;
    color:var(--gold);
    margin-bottom:10px;
    display:flex; align-items:center; gap:10px;
  }
  .day-block > .dname .dd{ font-size:12px; color:var(--muted); font-weight:600; }

  .cards{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:12px; }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    border-top:3px solid var(--c);
    box-shadow: var(--shadow);
  }
  .card .title{ font-weight:800; font-size:14.5px; margin-bottom:4px; }
  .card .type{ font-size:12px; color:var(--muted); margin-bottom:10px; }
  .card .row{ display:flex; justify-content:space-between; font-size:12.5px; margin-top:6px; }
  .card .row span:first-child{ color:var(--muted); }

  .empty-note{
    color:var(--muted); font-size:13.5px;
    background:var(--panel); border:1px dashed var(--line);
    border-radius:12px; padding:14px 16px;
  }

  footer{
    margin-top:46px;
    text-align:center;
    color:var(--muted);
    font-size:12px;
  }

  /* ===== Mobile: hide the grid timetable, keep the detail cards ===== */
  @media (max-width:680px){
    body{ padding: 24px 12px 50px; }
    header{ padding-top:60px; align-items:flex-start; }
    .stats{ width:100%; }
    .stat{ flex:1; }
    .board-scroll{ display:none; }
    .mobile-hint{ display:block; }
  }
  .mobile-hint{ display:none; color:var(--muted); font-size:12.5px; margin-bottom:18px; }

  /* ===== Password gate ===== */
  .gate-blur{
    filter: blur(14px);
    pointer-events: none;
    user-select: none;
    transition: filter .4s ease;
  }
  .gate-overlay{
    position: fixed;
    inset: 0;
    z-index: 100;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(10,12,20,0.55);
    padding: 20px;
    transition: opacity .35s ease;
  }
  .gate-overlay.hidden{
    opacity: 0;
    pointer-events: none;
  }
  .gate-card{
    width: 100%;
    max-width: 340px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 30px 26px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }
  .gate-card .gate-icon{
    width: 52px; height:52px;
    border-radius:50%;
    background: var(--gold-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:22px;
    margin: 0 auto 16px;
  }
  .gate-card h3{
    font-family:'Amiri', serif;
    font-size:20px;
    margin: 0 0 6px;
    color: var(--paper);
  }
  .gate-card p{
    font-size:12.5px;
    color: var(--muted);
    margin: 0 0 20px;
  }
  .gate-input{
    width:100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--paper);
    font-family:'Cairo', sans-serif;
    font-size: 14px;
    text-align:center;
    outline:none;
    margin-bottom: 12px;
    box-sizing:border-box;
    transition: border-color .2s ease;
  }
  .gate-input:focus{ border-color: var(--gold); }
  .gate-card.shake{
    animation: shake .35s ease;
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px); }
    75%{ transform:translateX(6px); }
  }
  .gate-btn{
    width:100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: none;
    background: var(--gold);
    color: #1a1408;
    font-family:'Cairo', sans-serif;
    font-weight:800;
    font-size: 14px;
    cursor:pointer;
    transition: opacity .2s ease;
  }
  .gate-btn:hover{ opacity:.9; }
  .gate-error{
    font-size:11.5px;
    color:#E06666;
    margin-top:10px;
    min-height:14px;
  }
</style>
</head>
<body>

<div class="gate-overlay" id="gateOverlay">
  <div class="gate-card">
    <div class="gate-icon">🔒</div>
    <h3>الجدول محمي</h3>
    <p>أدخل كلمة المرور لعرض جدولك الدراسي</p>
    <input type="password" id="gateInput" class="gate-input" placeholder="كلمة المرور" autocomplete="off">
    <button class="gate-btn" id="gateBtn">فتح الجدول</button>
    <div class="gate-error" id="gateError"></div>
  </div>
</div>

<div class="theme-toggle" id="themeToggle" role="button" aria-label="تبديل الوضع الليلي/النهاري">
  <span class="icon" id="themeIcon">🌙</span>
  <span class="label" id="themeLabel">ليلي</span>
</div>

<div class="wrap gate-blur" id="mainContent"></div>

<script>
  (function(){
    var root = document.documentElement;
    var toggle = document.getElementById('themeToggle');
    var icon = document.getElementById('themeIcon');
    var label = document.getElementById('themeLabel');

    function apply(theme){
      root.setAttribute('data-theme', theme);
      if(theme === 'dark'){
        icon.textContent = '🌙';
        label.textContent = 'ليلي';
      } else {
        icon.textContent = '☀️';
        label.textContent = 'نهاري';
      }
      try { localStorage.setItem('schedule-theme', theme); } catch(e){}
    }

    var saved = null;
    try { saved = localStorage.getItem('schedule-theme'); } catch(e){}
    var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    apply(saved || (prefersLight ? 'light' : 'dark'));

    toggle.addEventListener('click', function(){
      var current = root.getAttribute('data-theme');
      apply(current === 'dark' ? 'light' : 'dark');
    });
  })();

      iterations: 200000
    };

    var overlay = document.getElementById('gateOverlay');
    var content = document.getElementById('mainContent');
    var input = document.getElementById('gateInput');
    var btn = document.getElementById('gateBtn');
    var error = document.getElementById('gateError');
    var gateCard = overlay.querySelector('.gate-card');

    function b64ToBytes(b64){
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    async function deriveKey(password, saltBytes, iterations){
      var enc = new TextEncoder();
      var baseKey = await crypto.subtle.importKey(
        'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: saltBytes, iterations: iterations, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }

    async function attemptDecrypt(password){
      var saltBytes = b64ToBytes(ENC.salt);
      var ivBytes = b64ToBytes(ENC.iv);
      var ctBytes = b64ToBytes(ENC.ct);
      var key = await deriveKey(password, saltBytes, ENC.iterations);
      var plainBuf = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: ivBytes }, key, ctBytes
      );
      return new TextDecoder().decode(plainBuf);
    }

    function setBusy(busy){
      btn.disabled = busy;
      btn.textContent = busy ? 'جارٍ التحقق…' : 'فتح الجدول';
    }

    async function tryUnlock(){
      var pwd = input.value;
      if(!pwd){ return; }
      setBusy(true);
      error.textContent = '';
      try {
        var html = await attemptDecrypt(pwd);
        content.innerHTML = html;
        overlay.classList.add('hidden');
        content.classList.remove('gate-blur');
      } catch (e) {
        error.textContent = 'كلمة المرور غير صحيحة، حاول مرة أخرى';
        gateCard.classList.remove('shake');
        void gateCard.offsetWidth;
        gateCard.classList.add('shake');
        input.value = '';
        input.focus();
      } finally {
        setBusy(false);
      }
    }

    btn.addEventListener('click', tryUnlock);
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ tryUnlock(); }
    });
    input.focus();
  })();
</script>
